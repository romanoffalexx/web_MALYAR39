services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malyar39-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
